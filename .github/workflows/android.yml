name: Build Klyro APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and sign Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore generated launcher artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode assets/klyro_launcher.jpg.b64 > app/src/main/res/drawable-nodpi/klyro_launcher.jpg

      - name: Build auto-signed debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Klyro-Screen-Studio-1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klyro-APK
          path: Klyro-Screen-Studio-1.0.0.apk
          if-no-files-found: error
          retention-days: 30
